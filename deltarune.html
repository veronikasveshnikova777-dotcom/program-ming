<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deltarune</title>
  <link rel="stylesheet" type="text/css" href="deltarune.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 20px;
    }

    .grid-container {
      display: grid;
      /* Column widths: 30%, 20%, 18%, 17%, 15% */
      grid-template-columns: 30% 20% 18% 17% 15%;
      /* Scaled row heights totaling 100%: Yellow, Green, Red-row-1, Red-row-2, Red-row-3, Red-row-4 */
      grid-template-rows: 10% 6% 15% 47% 7% 15%;
      gap: 3px;
      background-color: #000000;
      border: 3px solid #000000;
      width: 95vw;
      height: 63vw;
      max-width: 1200px;
      max-height: 800px;
    }

    .grid-cell {
      background-color: #ffffff;
    }

    /* Colors defined by the reference diagram */
    .color-yellow {
      background-color: #ffff00;
    }
    .color-green {
      background-color: #00ff00;
    }
    .color-red {
      background-color: #ff0000;
    }
    .color-blue {
      background-color: #00ccff;
    }

    /* Row 1 (Yellow) */
    .cell-1-yellow {
      grid-column: 1 / 6;
      grid-row: 1 / 2;
    }

    /* Row 2 (Green) */
    .cell-2-green-left {
      grid-column: 1 / 2;
      grid-row: 2 / 3;
    }
    .cell-2-green-mid {
      grid-column: 2 / 5;
      grid-row: 2 / 3;
    }
    .cell-2-green-right {
      grid-column: 5 / 6;
      grid-row: 2 / 3;
    }

    /* Row 3 (Red & Blue) */
    .cell-3-red-left {
      grid-column: 1 / 2;
      grid-row: 3 / 4;
      
    }
    .cell-3-red-mid {
      grid-column: 2 / 4;
      grid-row: 3 / 4;
    }
    .cell-3-red-right {
      grid-column: 4 / 5;
      grid-row: 3 / 4;
    }
    .cell-3-blue-sidebar {
      grid-column: 5 / 6;
      grid-row: 3 / 4;
    }

    /* Row 4 & 5 Red area */
    .cell-4-red-left-big {
      grid-column: 1 / 3;
      grid-row: 4 / 6;
      padding: 50px;
      
      
      
    }
    .cell-4-red-mid-big {
      grid-column: 3 / 5;
      grid-row: 4 / 5;
    }
    .cell-5-red-mid-thin {
      grid-column: 3 / 5;
      grid-row: 5 / 6;
    }

    /* Row 6 Red area */
    .cell-6-red-left {
      grid-column: 1 / 3;
      grid-row: 6 / 7;
    }
    .cell-6-red-mid {
      grid-column: 3 / 5;
      grid-row: 6 / 7;
    }

    /* Sidebar Spanning Column 5, Rows 4-6 (Blue stack) */
    .sidebar {
      grid-column: 5 / 6;
      grid-row: 3 / 5;
      display: flex;
      flex-direction: column;
      gap: 3px;
      background-color: #000000;
      height: 150%;
    }

    .sidebar-cell {
      flex: 1;
      padding:20px
    }
  </style>
</head>
<body>

  <div class="grid-container">
    <!-- Row 1 (Yellow) -->
    <div class="grid-cell cell-1-yellow color-yellow"></div>

    <!-- Row 2 (Green) -->
    <div class="grid-cell cell-2-green-left color-green">Undertale Page</div>
    <div class="grid-cell cell-2-green-mid color-green"></div>
    <div class="grid-cell cell-2-green-right color-green"></div>

    <!-- Row 3 (Red/Blue) -->
    <div class="grid-cell cell-3-red-left color-red">
        <a href="https://www.sosasou.cz/">
                    <span>
                        <button> OFFICIAL WEB</button>
                    </span>
                </a>

    </div>
    <div class="grid-cell cell-3-red-mid color-red"><h1 class="strokeme">DELTARUNE</h1></div>
    <div class="grid-cell cell-3-red-right color-red">
        <a href="https://www.sosasou.cz/">
                    <span>
                        <button>STEAM</button>
                    </span>
                </a>
    </div>
    <div class="grid-cell cell-3-blue-sidebar color-blue"></div>

    <!-- Row 4 & 5 -->
    <div class="grid-cell cell-4-red-left-big color-red">
        <p class="yellow-text-outline">
            Deltarune is so dear to my heart.
         It's the best game I've played in my life.
          I can<br> relate to Kris a lot and I would love to buy official
           merch with them.<br> Also I love how they aurafarm lol
        </p>
    </div>
    <div class="grid-cell cell-4-red-mid-big color-red">
      <iframe class="animation" scrolling="no" frameborder="0" ></iframe>
    </div>
    <div class="grid-cell cell-5-red-mid-thin color-red"></div>

    <!-- Row 6 -->
    <div class="grid-cell cell-6-red-left color-red"></div>
    <div class="grid-cell cell-6-red-mid color-red"></div>

    <!-- Sidebar Stack (7 stacked vertical cells colored blue) -->
    <div class="sidebar">
      <div class="sidebar-cell color-blue">
        <img class="chibi" src="1000029052.png">
      </div>
      <div class="sidebar-cell color-blue">
         <img class="chibi" src="1000029049.png">
      </div>
      <div class="sidebar-cell color-blue">
        <img class="chibi" src="1000029050.png">
      </div>
      <div class="sidebar-cell color-blue">
        <img class="chibi" src="1000029051.png">
      </div>
      <div class="sidebar-cell color-blue"></div>
      
      
    </div>
  </div>

</body>
</html>
