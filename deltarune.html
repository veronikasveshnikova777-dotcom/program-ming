<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>deltarune</title>
    <link rel="stylesheet" type="text/css" href="deltarune.css">
    <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 20px;
    }

    .grid-container {
      display: grid;
      /* Column widths: 30%, 20%, 18%, 17%, 15% */
      grid-template-columns: 30% 20% 18% 17% 15%;
      /* Scaled row heights totaling 100% */
      grid-template-rows: 8% 7% 55% 7% 23%;
      gap: 3px;
      background-color: #000000;
      border: 3px solid #000000;
      width: 95vw;
      height: 63vw;
      max-width: 1200px;
      max-height: 800px;
    }

    .grid-cell {
      background-color: #ffffff;
    }

    /* Row 1 Positioning */
    .cell-1-1 {
      grid-column: 1 / 2;
      grid-row: 1 / 2;
    }
    .cell-1-2 {
      grid-column: 2 / 5;
      grid-row: 1 / 2;
    }
    .cell-1-3 {
      grid-column: 5 / 6;
      grid-row: 1 / 2;
    }

    /* Row 2 Positioning */
    .cell-2-1 {
      grid-column: 1 / 2;
      grid-row: 2 / 3;
    }
    .cell-2-2 {
      grid-column: 2 / 4;
      grid-row: 2 / 3;
    }
    .cell-2-3 {
      grid-column: 4 / 5;
      grid-row: 2 / 3;
    }
    .cell-2-4 {
      grid-column: 5 / 6;
      grid-row: 2 / 3;
    }

    /* Row 3 & 4 Span (Big Left Cell) */
    .cell-3-left {
      grid-column: 1 / 3;
      grid-row: 3 / 5;
    }

    /* Row 3 Right (Big Middle-Right Cell) */
    .cell-3-mid-right {
      grid-column: 3 / 5;
      grid-row: 3 / 4;
    }

    /* Row 4 Right (Thin Middle-Right Cell) */
    .cell-4-mid-right {
      grid-column: 3 / 5;
      grid-row: 4 / 5;
    }

    /* Row 5 Positioning */
    .cell-5-left {
      grid-column: 1 / 3;
      grid-row: 5 / 6;
    }
    .cell-5-mid-right {
      grid-column: 3 / 5;
      grid-row: 5 / 6;
    }

    /* Sidebar Spanning Column 5, Rows 3-5 */
    .sidebar {
      grid-column: 5 / 6;
      grid-row: 3 / 6;
      display: flex;
      flex-direction: column;
      gap: 3px;
      background-color: #000000;
      height: 100%;
    }

    .sidebar-cell {
      background-color: #ffffff;
      flex: 1;
    }
  </style>
</head>

<body>
    
    
<div class="grid-container">

    
    <!-- Row 1 -->
    <div class="grid-cell cell-1-1"></div>
    <div class="grid-cell cell-1-2"><h1 class ="strokeme">DELTARUNE</h1></div>
    <div class="grid-cell cell-1-3"></div>

    <!-- Row 2 -->
    <div class="grid-cell cell-2-1"></div>
    <div class="grid-cell cell-2-2"></div>
    <div class="grid-cell cell-2-3"></div>
    <div class="grid-cell cell-2-4"></div>

    <!-- Row 3 & 4 -->
    <div class="grid-cell cell-3-left"></div>
    <div class="grid-cell cell-3-mid-right"></div>
    <div class="grid-cell cell-4-mid-right"></div>

    <!-- Row 5 -->
    <div class="grid-cell cell-5-left"></div>
    <div class="grid-cell cell-5-mid-right"></div>

    <!-- Sidebar Stack (7 stacked vertical cells matching the sketch) -->
    <div class="sidebar">
      <div class="sidebar-cell"></div>
      <div class="sidebar-cell"></div>
      <div class="sidebar-cell"></div>
      <div class="sidebar-cell"></div>
      <div class="sidebar-cell"></div>
      <div class="sidebar-cell"></div>
      <div class="sidebar-cell"></div>
    </div>
  </div>
    

</body>

</html>
